<div class="dashboard">
  <main class="main-content">
    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">Projects</span>
        <strong>{{ totalProjects }}</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">In Progress</span>
        <strong>{{ inProgressProjects }}</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <strong>{{ completedProjects }}</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Planning</span>
        <strong>{{ planningProjects }}</strong>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="section-header">
        <h2>Recent Projects</h2>

        <button type="button">View all</button>
      </div>

      <div class="project-list">
        @for (project of recentProjects; track project.id) {
          <div class="project-card">
            <div>
              <h3>{{ project.name }}</h3>
              <p>{{ project.description }}</p>
            </div>

            <span
              class="status"
              [class.in-progress]="project.status === 'in-progress'"
              [class.completed]="project.status === 'completed'"
              [class.planning]="project.status === 'planning'"
            >
              {{ project.status }}
            </span>
          </div>
        }
      </div>
    </section>
  </main>
</div>
