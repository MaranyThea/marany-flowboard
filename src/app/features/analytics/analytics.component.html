<div class="analytics-page">

  <header class="page-header">

    <div>
      <h1>Analytics</h1>
      <p>Claims and transaction overview.</p>
    </div>

  </header>


  <section class="date-filter">

    <div class="form-group">

      <label for="startDate">
        Start Date
      </label>

      <input
        id="startDate"
        type="date">

    </div>


    <div class="form-group">

      <label for="endDate">
        End Date
      </label>

      <input
        id="endDate"
        type="date">

    </div>

  </section>


  <section class="stats-grid">

    <div class="stat-card">
      <span>NEW</span>
      <strong>0</strong>
    </div>

    <div class="stat-card">
      <span>REJECT</span>
      <strong>0</strong>
    </div>

    <div class="stat-card">
      <span>RETURN</span>
      <strong>0</strong>
    </div>

    <div class="stat-card">
      <span>APPROVED</span>
      <strong>0</strong>
    </div>

  </section>


  <section class="analytics-grid">

    <div class="analytics-card">
      <h2>Claims Received Per Day</h2>
      <div class="chart-placeholder">
        Chart coming next
      </div>
    </div>


    <div class="analytics-card">
      <h2>Claims by Type</h2>
      <div class="chart-placeholder">
        Chart coming next
      </div>
    </div>


    <div class="analytics-card">
      <h2>Amount by Branch</h2>
      <div class="chart-placeholder">
        Chart coming next
      </div>
    </div>

  </section>

</div>
