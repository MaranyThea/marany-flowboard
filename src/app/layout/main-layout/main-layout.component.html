<div class="app-layout" [class.sidebar-collapsed]="isSidebarCollapsed" [class.dark]="isDarkMode">
  <!-- Topbar -->
  <header class="topbar">

    <!-- Logo + Sidebar Toggle -->

    <div class="topbar-left">

      <!-- Hide / Show Sidebar -->

      <button type="button" class="sidebar-toggle" (click)="toggleSidebar()"
        [attr.aria-label]="isSidebarCollapsed ? 'Show sidebar' : 'Hide sidebar'">

        @if (isSidebarCollapsed) {

        <span>☰</span>
        } @else {
        <span>‹</span>
        }

      </button>
      <div class="logo">
        <img src="assets/images/flowboard-logo-02.PNG" alt="FlowBoard" class="logo-image" />
      </div>

    </div>



    <!-- Center Search -->
    <div class="search-container">

      <span class="search-icon">⌕</span>

      <input type="search" placeholder="Search..." aria-label="Search" />

    </div>


    <!-- Topbar Actions -->
    <div class="topbar-actions">
      <!-- Dark / Light Mode -->
      <!-- Dark / Light Mode -->
      <button type="button" class="icon-button" (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (isDarkMode) {
        <span>🌙</span>
        } @else {
        <span>☀️</span>
        }
      </button>
      <!-- Notifications -->
      <button type="button" class="icon-button" aria-label="Notifications">
        🔔
      </button>

      <!-- User Profile -->
      <div class="profile-container">

        <!-- Profile Button -->
        <button type="button" class="user-profile" aria-label="Open user profile" (click)="toggleProfileMenu()">
          <div class="user-avatar">
            {{ userInitial }}
          </div>
        </button>

        <!-- Profile Dropdown -->
        @if (isProfileMenuOpen) {
        <div class="profile-dropdown">

          <div class="profile-info">
            <span class="profile-label">Signed in as</span>

            <span class="profile-name">
              {{ authService.user()?.name }}
            </span>

            <span class="profile-email">
              {{ authService.user()?.email }}
            </span>
          </div>

          <div class="profile-divider"></div>

          <button type="button" class="sign-out-button" (click)="logout()">
            Sign out
          </button>

        </div>
        }

      </div>

    </div>

  </header>


  <!-- Body -->
  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">

      <nav class="navigation">

        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item">
          Dashboard
        </a>

        <a routerLink="/projects" routerLinkActive="active" class="nav-item">
          Projects
        </a>

        <a routerLink="/issues" routerLinkActive="active" class="nav-item">
          Issues
        </a>

        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          Users
        </a>

        <a routerLink="/analytics" routerLinkActive="active" class="nav-item">
          Analytics
        </a>

        <a routerLink="/settings" routerLinkActive="active" class="nav-item">
          Settings
        </a>

      </nav>

    </aside>


    <!-- Main Area -->
    <main class="main-content">

      <section class="page-content">

        <router-outlet></router-outlet>

      </section>

    </main>

  </div>

</div>
