<div class="app-layout">

  <!-- Topbar -->
  <header class="topbar">

    <div class="logo">
      <img src="assets/images/flowboard-logo-02.PNG" alt="Apex" class="logo-image" />
    </div>

    <div class="search-container">
      <span class="search-icon">⌕</span>

      <input type="search" placeholder="Search..." aria-label="Search" />
    </div>

    <div class="topbar-actions">

      <button type="button" class="icon-button" aria-label="Toggle dark mode">
        ☀
      </button>

      <div class="user-profile">
        <div class="user-avatar">M</div>
      </div>

    </div>

  </header>


  <!-- Body -->
  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">

      <nav class="navigation">

        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item">
          Dashboard
        </a>

        <a routerLink="/projects" routerLinkActive="active" class="nav-item">
          Projects
        </a>

        <a routerLink="/issues" routerLinkActive="active" class="nav-item">
          Issues
        </a>

        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          Users
        </a>

        <a routerLink="/analytics" routerLinkActive="active" class="nav-item">
          Analytics
        </a>

        <a routerLink="/settings" routerLinkActive="active" class="nav-item">
          Settings
        </a>

      </nav>

      <div class="sidebar-bottom">

        <button type="button" (click)="logout()">
          Logout
        </button>

      </div>

    </aside>


    <!-- Main Area -->
    <main class="main-content">

      <section class="page-content">
        <router-outlet></router-outlet>
      </section>

    </main>

  </div>

</div>
