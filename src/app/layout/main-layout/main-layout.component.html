<div class="app-layout">

  <!-- Topbar -->
  <header class="topbar">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/images/flowboard-logo-02.PNG" alt="Apex" class="logo-image" />
    </div>


    <!-- Center Search -->
    <div class="profile-container">

      <!-- Profile Button -->
      <button type="button" class="user-profile" aria-label="Open user profile" (click)="toggleProfileMenu()">
        <div class="user-avatar">
          {{ userInitial }}
        </div>
      </button>

      <!-- Profile Dropdown -->
      @if (isProfileMenuOpen) {
      <div class="profile-dropdown">

        <div class="profile-info">
          <span class="profile-label">Signed in as</span>

          <span class="profile-name">
            {{ authService.user()?.name }}
          </span>

          <span class="profile-email">
            {{ authService.user()?.email }}
          </span>
        </div>

        <div class="profile-divider"></div>

        <button type="button" class="sign-out-button" (click)="logout()">
          Sign out
        </button>

      </div>
      }

    </div>
    <div class="search-container">

      <span class="search-icon">⌕</span>

      <input type="search" placeholder="Search..." aria-label="Search" />

    </div>


    <!-- Topbar Actions -->
    <div class="topbar-actions">
      <!-- Dark / Light Mode -->
      <button type="button" class="icon-button" aria-label="Toggle dark mode">
        ☀
      </button>
      <!-- Notifications -->
      <button type="button" class="icon-button" aria-label="Notifications">
        🔔
      </button>

      <!-- User Profile -->
      <div class="user-profile" aria-label="User profile">
        <div class="user-avatar">
          {{ userInitial }}
        </div>
      </div>

    </div>

  </header>


  <!-- Body -->
  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">

      <nav class="navigation">

        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-item">
          Dashboard
        </a>

        <a routerLink="/projects" routerLinkActive="active" class="nav-item">
          Projects
        </a>

        <a routerLink="/issues" routerLinkActive="active" class="nav-item">
          Issues
        </a>

        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          Users
        </a>

        <a routerLink="/analytics" routerLinkActive="active" class="nav-item">
          Analytics
        </a>

        <a routerLink="/settings" routerLinkActive="active" class="nav-item">
          Settings
        </a>

      </nav>


      <div class="sidebar-bottom">

        <button type="button" (click)="logout()">
          Logout
        </button>

      </div>

    </aside>


    <!-- Main Area -->
    <main class="main-content">

      <section class="page-content">

        <router-outlet></router-outlet>

      </section>

    </main>

  </div>

</div>
